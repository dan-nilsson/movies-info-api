{% extends 'layout.html' %}
{% block content %}
    {% for movie in movies %}
        <h2>{{movie.title}}</h2>
        <p>Director: {{movie.director}}</p>
        <p>Year: {{movie.year}}</p>
        <p>Runtime: {{movie.runtime}} minutes</p>
        <p>Genre: {{movie.genre}}</p>
        <p>Rating: {{movie.rating}} / 10</p>
    {% endfor %}
{% endblock content %}
